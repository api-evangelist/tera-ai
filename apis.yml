aid: tera-ai
name: Tera-ai
description: Tera AI is a San Francisco-based robotics AI company (founded 2023, out
  of stealth March 2025 with $7.8M seed co-led by Felicis and Inovia) that builds
  the first unified, software-only spatial reasoning stack for camera-based mapping
  and navigation across air, onroad, offroad, and sea platforms. Its foundation-model
  approach delivers GPS-denied, manufacturer-interoperable autonomy that runs on a
  robot's existing camera and onboard GPU. Tera publishes research (TARDIS/STRIDE)
  and technical field results but does not currently expose a public developer API,
  SDK, or documentation portal; this profile captures its public web, research, and
  GitHub surface.
